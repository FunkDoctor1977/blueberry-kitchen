<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Blueberry Kitchen 🫐</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&display=swap" rel="stylesheet" />
  <style>
/* Rahmah's Kitchen - warm, playful, big-buttoned, tablet-first */
:root {
  --cream: #fff6ec;
  --card: #ffffff;
  --ink: #4a3728;
  --ink-soft: #6f5a48;
  --straw: #ff6f61;
  --straw-dark: #e85a4f;
  --peach: #ffd9b3;
  --mint: #9fd8c9;
  --mint-dark: #2e8b74;
  --sun: #ffc94d;
  --lilac: #c7b9ff;
  --radius: 22px;
  --shadow: 0 6px 0 rgba(74, 55, 40, 0.12);
}

* { box-sizing: border-box; margin: 0; padding: 0; }

html { -webkit-text-size-adjust: 100%; }

body {
  font-family: "Baloo 2", "Comic Sans MS", "Segoe UI", sans-serif;
  background: var(--cream);
  background-image: radial-gradient(#ffe8d1 1.5px, transparent 1.5px);
  background-size: 26px 26px;
  color: var(--ink);
  min-height: 100vh;
}

.hidden { display: none !important; }

/* ---------- Top bar ---------- */
#topbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 10px;
  padding: 14px 20px;
  background: var(--card);
  border-bottom: 4px solid var(--peach);
  position: sticky;
  top: 0;
  z-index: 10;
}
.brand { font-size: 1.5rem; font-weight: 800; color: var(--straw); }
nav { display: flex; gap: 8px; flex-wrap: wrap; }
.nav-btn {
  font-family: inherit;
  font-size: 1rem;
  font-weight: 700;
  padding: 12px 18px;
  min-height: 44px;
  border: none;
  border-radius: 999px;
  background: var(--peach);
  color: var(--ink);
  cursor: pointer;
  box-shadow: var(--shadow);
}
.nav-btn:active { transform: translateY(3px); box-shadow: none; }
.nav-btn.active { background: var(--straw); color: white; }

/* ---------- Layout ---------- */
#view { max-width: 900px; margin: 0 auto; padding: 20px 16px 80px; }

.card {
  background: var(--card);
  border-radius: var(--radius);
  padding: 20px;
  box-shadow: var(--shadow);
  margin-bottom: 18px;
}

h1 { font-size: 1.9rem; font-weight: 800; margin-bottom: 8px; }
h2 { font-size: 1.4rem; font-weight: 800; margin-bottom: 8px; }
p.sub { color: var(--ink-soft); margin-bottom: 14px; }

/* ---------- Buttons ---------- */
.btn {
  font-family: inherit;
  font-size: 1.15rem;
  font-weight: 800;
  padding: 14px 26px;
  border: none;
  border-radius: 999px;
  cursor: pointer;
  box-shadow: var(--shadow);
  transition: transform 0.05s;
}
.btn:active { transform: translateY(3px); box-shadow: none; }
.btn-primary { background: var(--straw); color: white; }
.btn-primary:hover { background: var(--straw-dark); }
.btn-secondary { background: var(--mint); color: var(--ink); }
.btn-ghost { background: transparent; box-shadow: none; color: var(--ink-soft); font-size: 0.95rem; }
.btn-big { width: 100%; font-size: 1.3rem; padding: 18px; }
.btn:disabled { opacity: 0.45; cursor: not-allowed; }

/* ---------- Onboarding ---------- */
.onboard { text-align: center; padding-top: 30px; }
.onboard .mascot { font-size: 4.5rem; }
.onboard input[type="text"] {
  font-family: inherit;
  font-size: 1.3rem;
  font-weight: 700;
  text-align: center;
  padding: 14px;
  width: min(320px, 90%);
  border: 3px solid var(--peach);
  border-radius: var(--radius);
  margin: 14px 0;
  color: var(--ink);
  background: var(--card);
}
.chip-row { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; margin: 14px 0 22px; }
.chip {
  font-family: inherit;
  font-size: 1.05rem;
  font-weight: 700;
  padding: 12px 20px;
  border: 3px solid var(--peach);
  border-radius: 999px;
  background: var(--card);
  color: var(--ink);
  cursor: pointer;
}
.chip.selected { background: var(--mint); border-color: var(--mint-dark); }

/* ---------- Home ---------- */
.hero {
  display: flex;
  align-items: center;
  gap: 16px;
  background: linear-gradient(135deg, #fff1e0, #ffe3ee);
}
.hero .avatar { font-size: 3.4rem; }
.rank-name { font-weight: 800; font-size: 1.2rem; color: var(--straw-dark); }
.xp-bar { background: #f2e4d4; border-radius: 999px; height: 16px; overflow: hidden; margin-top: 6px; }
.xp-fill { background: linear-gradient(90deg, var(--sun), var(--straw)); height: 100%; border-radius: 999px; transition: width 0.6s; }
.xp-label { font-size: 0.9rem; color: var(--ink-soft); margin-top: 4px; }

.searchbar {
  display: flex;
  gap: 10px;
  margin-bottom: 14px;
}
.searchbar input {
  flex: 1;
  font-family: inherit;
  font-size: 1.1rem;
  font-weight: 600;
  padding: 14px 18px;
  border: 3px solid var(--peach);
  border-radius: 999px;
  background: var(--card);
  color: var(--ink);
}
.searchbar input:focus { outline: 3px solid var(--sun); }

.cat-row { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 18px; }
.cat {
  font-family: inherit;
  font-weight: 700;
  font-size: 1rem;
  padding: 12px 18px;
  min-height: 44px;
  border: none;
  border-radius: 999px;
  background: var(--card);
  color: var(--ink-soft);
  cursor: pointer;
  box-shadow: var(--shadow);
}
.cat.active { background: var(--sun); color: var(--ink); }

.recipe-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 14px; }
.recipe-card {
  background: var(--card);
  border-radius: var(--radius);
  padding: 18px;
  box-shadow: var(--shadow);
  cursor: pointer;
  border: 3px solid transparent;
  text-align: left;
  font-family: inherit;
  color: var(--ink);
}
.recipe-card:hover { border-color: var(--sun); }
.recipe-card .big-emoji { font-size: 2.6rem; }
.recipe-card h3 { font-size: 1.15rem; font-weight: 800; margin: 6px 0 4px; }
.meta { font-size: 0.9rem; color: var(--ink-soft); font-weight: 600; }
.stars-mini { color: var(--sun); font-size: 0.95rem; }
.done-tick { color: var(--mint-dark); font-weight: 800; font-size: 0.85rem; }

/* ---------- Recipe detail ---------- */
.detail-head { display: flex; align-items: center; gap: 14px; }
.detail-head .big-emoji { font-size: 3.6rem; }
.pill-row { display: flex; flex-wrap: wrap; gap: 8px; margin: 10px 0; }
.pill {
  font-size: 0.85rem;
  font-weight: 700;
  background: var(--peach);
  padding: 5px 12px;
  border-radius: 999px;
}
.pill.diet { background: #e2f4ee; color: var(--mint-dark); }
ul.ingredients { list-style: none; margin: 8px 0; }
ul.ingredients li { padding: 8px 0 8px 30px; position: relative; border-bottom: 2px dashed #f4e6d6; font-weight: 600; }
ul.ingredients li::before { content: "🛒"; position: absolute; left: 0; }

/* ---------- Cooking mode ---------- */
.cook-progress { display: flex; gap: 6px; margin-bottom: 16px; }
.cook-progress .dot { flex: 1; height: 10px; border-radius: 999px; background: #f2e4d4; }
.cook-progress .dot.done { background: var(--mint); }
.cook-progress .dot.now { background: var(--straw); }

.step-card { text-align: center; padding: 30px 22px; }
.step-num { font-weight: 800; color: var(--ink-soft); letter-spacing: 1px; text-transform: uppercase; font-size: 0.9rem; }
.step-text { font-size: 1.45rem; font-weight: 700; line-height: 1.45; margin: 14px 0 20px; }

.safety-banner {
  background: #fff1c9;
  border: 3px dashed var(--sun);
  border-radius: var(--radius);
  padding: 12px 16px;
  font-weight: 800;
  color: #8a6400;
  margin-bottom: 16px;
  font-size: 1.05rem;
}

/* ---------- Timer & challenges ---------- */
.timer-display { font-size: 3.4rem; font-weight: 800; color: var(--straw); letter-spacing: 2px; }
.timer-sub { color: var(--ink-soft); font-weight: 700; margin-bottom: 10px; }
.challenge-card { background: #f3efff; border: 3px solid var(--lilac); }
.challenge-q { font-size: 1.25rem; font-weight: 800; margin-bottom: 14px; }
.answer-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.answer-btn {
  font-family: inherit;
  font-size: 1.05rem;
  font-weight: 700;
  padding: 14px;
  border: 3px solid var(--lilac);
  border-radius: var(--radius);
  background: var(--card);
  color: var(--ink);
  cursor: pointer;
}
.answer-btn.correct { background: var(--mint); border-color: var(--mint-dark); }
.answer-btn.wrong { background: #ffd6d1; border-color: var(--straw); }
.science-card { background: #e8f6ff; border: 3px solid #9ed3f0; }
.science-card h3 { margin-bottom: 8px; }
.science-card p { font-size: 1.1rem; font-weight: 600; line-height: 1.5; }

/* ---------- Finish / photo / review ---------- */
.finish { text-align: center; }
.confetti { font-size: 2.6rem; letter-spacing: 6px; }
.photo-preview {
  max-width: 100%;
  max-height: 340px;
  border-radius: var(--radius);
  border: 5px solid var(--card);
  box-shadow: var(--shadow);
  margin: 14px auto;
  display: block;
}
input[type="file"] { display: none; }
.stars-big { font-size: 2.4rem; letter-spacing: 4px; }
.review-list { text-align: left; margin: 14px auto; max-width: 520px; }
.review-list .item { padding: 10px 14px; border-radius: 14px; margin-bottom: 8px; font-weight: 600; }
.review-list .good { background: #e2f4ee; }
.review-list .tip { background: #fff1c9; }
.fun-comment { font-style: italic; font-weight: 700; color: var(--straw-dark); margin-top: 10px; }
.sticker-reveal { font-size: 4.5rem; animation: pop 0.5s ease; }
@keyframes pop { 0% { transform: scale(0); } 80% { transform: scale(1.25); } 100% { transform: scale(1); } }
.spinner {
  display: inline-block;
  font-size: 2.6rem;
  animation: spin 1.4s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* ---------- Cookbook ---------- */
.cookbook-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 14px; }
.book-entry {
  overflow: hidden;
  padding: 0;
  border: none;
  font-family: inherit;
  text-align: left;
  color: var(--ink);
  cursor: pointer;
}
.book-entry:hover { outline: 3px solid var(--sun); }
.book-entry img { width: 100%; height: 160px; object-fit: cover; display: block; }
.book-entry .body { padding: 12px 14px; }
.book-entry h3 { font-size: 1.05rem; font-weight: 800; }
.book-entry .date { font-size: 0.9rem; color: var(--ink-soft); font-weight: 600; }
.empty-state { text-align: center; padding: 40px 20px; color: var(--ink-soft); font-weight: 700; }
.empty-state .big-emoji { font-size: 3.4rem; display: block; margin-bottom: 10px; }

/* ---------- Badges ---------- */
.badge-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; }
.badge-tile { text-align: center; padding: 18px 10px; }
.badge-tile .big-emoji { font-size: 2.6rem; filter: grayscale(1); opacity: 0.35; }
.badge-tile.earned .big-emoji { filter: none; opacity: 1; }
.badge-tile h4 { font-size: 0.95rem; font-weight: 800; margin-top: 6px; }
.badge-tile p { font-size: 0.9rem; color: var(--ink-soft); font-weight: 600; }
.badge-tile.earned { border: 3px solid var(--sun); }

/* ---------- My Own Recipes ---------- */
.builder-cta {
  border: 3px dashed var(--straw);
  background: #fff1e0;
  text-align: center;
}
.builder-cta h3 { color: var(--straw-dark); }
.invent-cta {
  border: 3px dashed var(--lilac);
  background: #f3efff;
  text-align: center;
}
.invent-cta h3 { color: #6b5bb5; }
.my-pill {
  display: inline-block;
  font-size: 0.75rem;
  font-weight: 800;
  background: #f3efff;
  color: #6b5bb5;
  border: 2px solid var(--lilac);
  padding: 2px 10px;
  border-radius: 999px;
  margin: 4px 0;
}
.ai-pill {
  display: inline-block;
  font-size: 0.75rem;
  font-weight: 800;
  background: var(--lilac);
  color: #443787;
  border: 2px solid #a793f2;
  padding: 2px 10px;
  border-radius: 999px;
  margin: 4px 0;
}
.builder h2 { margin-top: 14px; }
.builder input[type="text"],
.builder input[type="number"] {
  font-family: inherit;
  font-size: 1.1rem;
  font-weight: 600;
  padding: 12px 16px;
  border: 3px solid var(--peach);
  border-radius: 999px;
  background: var(--card);
  color: var(--ink);
  width: 100%;
  margin-bottom: 6px;
}
.builder input:focus { outline: 3px solid var(--sun); }
.builder-chips { justify-content: flex-start; margin: 8px 0 6px; }
.emoji-row { display: flex; flex-wrap: wrap; gap: 8px; margin: 8px 0 6px; }
.emoji-btn {
  font-family: inherit;
  font-size: 1.7rem;
  padding: 8px 12px;
  border: 3px solid var(--peach);
  border-radius: var(--radius);
  background: var(--card);
  cursor: pointer;
}
.emoji-btn.selected { background: var(--mint); border-color: var(--mint-dark); }
.builder-add-row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-top: 10px; }
.builder .builder-add-row input { flex: 1; min-width: 180px; width: auto; margin-bottom: 0; }
.builder-toggle { display: block; font-weight: 700; font-size: 1.05rem; margin: 12px 0; }
.builder-toggle input[type="checkbox"] { width: 22px; height: 22px; accent-color: var(--straw); vertical-align: middle; margin-right: 6px; }
.builder .builder-toggle input[type="number"] { width: 90px; margin: 0 4px; padding: 8px 12px; }
.remove-btn {
  font-family: inherit;
  font-size: 0.9rem;
  font-weight: 800;
  border: none;
  border-radius: 999px;
  background: #ffd6d1;
  color: var(--straw-dark);
  padding: 4px 10px;
  cursor: pointer;
  margin-left: 8px;
}
ol.builder-steps { list-style: none; margin: 8px 0; counter-reset: step; }
ol.builder-steps li { padding: 8px 0 8px 34px; position: relative; border-bottom: 2px dashed #f4e6d6; font-weight: 600; counter-increment: step; }
ol.builder-steps li::before { content: counter(step) "."; position: absolute; left: 0; font-weight: 800; color: var(--straw); }
li.builder-empty { color: var(--ink-soft); }
ul.ingredients li.builder-empty::before,
ol.builder-steps li.builder-empty::before { content: "✨"; }

/* ---------- Toast ---------- */
#toast {
  position: fixed;
  bottom: 24px;
  left: 50%;
  transform: translateX(-50%);
  background: var(--ink);
  color: var(--cream);
  font-weight: 800;
  font-size: 1.05rem;
  padding: 14px 24px;
  border-radius: 999px;
  z-index: 100;
  box-shadow: 0 8px 20px rgba(0,0,0,0.25);
  animation: rise 0.3s ease;
}
@keyframes rise { from { opacity: 0; transform: translate(-50%, 20px); } to { opacity: 1; transform: translate(-50%, 0); } }

/* ---------- Resume-cooking banner ---------- */
.resume-banner {
  display: block;
  width: 100%;
  font-family: inherit;
  font-size: 1.1rem;
  font-weight: 800;
  text-align: left;
  background: var(--mint);
  color: var(--ink);
  border: 3px solid var(--mint-dark);
  border-radius: var(--radius);
  padding: 16px 20px;
  margin-bottom: 18px;
  cursor: pointer;
  box-shadow: var(--shadow);
}
.resume-banner:active { transform: translateY(3px); box-shadow: none; }

/* ---------- Grown-ups' corner ---------- */
.key-input {
  font-family: monospace;
  font-size: 1rem;
  padding: 14px 16px;
  border: 3px solid var(--peach);
  border-radius: var(--radius);
  background: var(--card);
  color: var(--ink);
  width: 100%;
  margin-bottom: 14px;
}
.key-input:focus { outline: 3px solid var(--sun); }

@media (max-width: 560px) {
  .answer-grid { grid-template-columns: 1fr; }
  .step-text { font-size: 1.25rem; }
  .brand { font-size: 1.2rem; }
}

</style>
</head>
<body>
  <header id="topbar" class="hidden">
    <div class="brand" id="brand">🫐 Blueberry Kitchen</div>
    <nav>
      <button class="nav-btn" data-nav="home">🏠 Home</button>
      <button class="nav-btn" data-nav="cookbook">📖 My Cookbook</button>
      <button class="nav-btn" data-nav="badges">🏅 My Badges</button>
    </nav>
  </header>

  <main id="view"></main>

  <div id="toast" class="hidden"></div>

  <script>window.RK_STANDALONE = true;
// Recipe library for Rahmah's Kitchen

  <script>
/* Review client for Rahmah's Kitchen.
   Two modes:
   - Server mode (default): POSTs the photo to /api/review; the key lives in .env on the PC.
   - Standalone/tablet mode (window.RK_STANDALONE): calls the AI directly from the browser
     using a key a grown-up saved on this device (Badges page -> Grown-ups' corner).
   Either way the caller gets { stars, wentWell[2], tryNext, funComment, source }. */

const GROWN_UP_KEY_STORAGE = "rahmahs-kitchen-grown-up-key";

const CLIENT_REVIEW_SCHEMA = {
  type: "object",
  properties: {
    stars: { type: "integer", enum: [3, 4, 5] },
    wentWell: { type: "array", items: { type: "string" } },
    tryNext: { type: "string" },
    funComment: { type: "string" },
  },
  required: ["stars", "wentWell", "tryNext", "funComment"],
  additionalProperties: false,
};

const CLIENT_LOCAL_REVIEWS = [
  {
    stars: 4,
    wentWell: ["It looks like you followed the steps really carefully", "The colours in your dish look lovely and appetising"],
    tryNext: "Next time, try adding a little decoration on top to make it extra fancy!",
    funComment: "Chef Sparkle would definitely ask for seconds!",
  },
  {
    stars: 4,
    wentWell: ["Great job getting everything onto the plate so neatly", "You can tell a lot of love went into making this"],
    tryNext: "Try plating it up with a colourful napkin next time for the full restaurant effect!",
    funComment: "If tasty had a picture in the dictionary, this might be it!",
  },
  {
    stars: 5,
    wentWell: ["This looks like something from a proper bakery", "Brilliant effort from start to finish"],
    tryNext: "Next time, challenge yourself to make double so the whole family gets some!",
    funComment: "Five stars! Chef Sparkle is doing a happy dance!",
  },
];

function clientReviewPrompt(name) {
  return `You are "Chef Sparkle", the warm, encouraging judge on a kids' cooking show.
A child around 9 years old named ${name} has just cooked or baked something and photographed it.
Review the photo of their dish. Rules you must always follow:
- Be kind, playful and encouraging. Never harsh, never sarcastic about the child's effort.
- Stars are 3, 4 or 5 only. 3 means "a great first go", 5 means "wow, restaurant-worthy!".
- "wentWell" must contain EXACTLY 2 short things that genuinely look good in the photo.
- "tryNext" is EXACTLY 1 gentle, fun tip to try next time, framed as an exciting experiment.
- "funComment" is one short sentence that would make a 9-year-old giggle or feel proud.
- Use simple words a 9-year-old understands. British English spelling.
- If the photo does not appear to show food, be playful about it, give 3 stars, and encourage them to snap their dish.`;
}

function clientClampReview(raw) {
  const review = {
    stars: [3, 4, 5].includes(Number(raw.stars)) ? Number(raw.stars) : 4,
    wentWell: Array.isArray(raw.wentWell) ? raw.wentWell.slice(0, 2).map(String) : [],
    tryNext: String(raw.tryNext || "Try a sprinkle of something colourful on top next time!"),
    funComment: String(raw.funComment || "Chef Sparkle says: keep on cooking, superstar!"),
  };
  while (review.wentWell.length < 2) {
    review.wentWell.push("You finished the whole recipe from start to end - that takes real focus!");
  }
  return review;
}

function pickClientLocalReview() {
  return { ...CLIENT_LOCAL_REVIEWS[Math.floor(Math.random() * CLIENT_LOCAL_REVIEWS.length)], source: "local" };
}

function grownUpKey() {
  try { return localStorage.getItem(GROWN_UP_KEY_STORAGE) || ""; } catch (e) { return ""; }
}
function saveGrownUpKey(key) {
  try { localStorage.setItem(GROWN_UP_KEY_STORAGE, key.trim()); return true; } catch (e) { return false; }
}
function removeGrownUpKey() {
  try { localStorage.removeItem(GROWN_UP_KEY_STORAGE); } catch (e) { /* fine */ }
}
function grownUpKeyKind(key) {
  if (!key) return null;
  return key.startsWith("sk-ant") ? "claude" : "openai";
}

async function claudeBrowserReview(mediaType, base64, recipeTitle, childName, key, signal) {
  const res = await fetch("https://api.anthropic.com/v1/messages", {
    method: "POST",
    signal,
    headers: {
      "content-type": "application/json",
      "x-api-key": key,
      "anthropic-version": "2023-06-01",
      "anthropic-dangerous-direct-browser-access": "true",
    },
    body: JSON.stringify({
      model: "claude-opus-4-8",
      max_tokens: 2048,
      system: clientReviewPrompt(childName),
      output_config: { format: { type: "json_schema", schema: CLIENT_REVIEW_SCHEMA } },
      messages: [
        {
          role: "user",
          content: [
            { type: "image", source: { type: "base64", media_type: mediaType, data: base64 } },
            { type: "text", text: `${childName} just made: "${recipeTitle}". Here is the photo of the finished dish. Please review it.` },
          ],
        },
      ],
    }),
  });
  if (!res.ok) throw new Error(`Claude API error ${res.status}`);
  const data = await res.json();
  const textBlock = (data.content || []).find((b) => b.type === "text");
  return JSON.parse(textBlock.text);
}

async function openaiBrowserReview(mediaType, base64, recipeTitle, childName, key, signal) {
  const res = await fetch("https://api.openai.com/v1/chat/completions", {
    method: "POST",
    signal,
    headers: { "content-type": "application/json", Authorization: `Bearer ${key}` },
    body: JSON.stringify({
      model: "gpt-4o-mini",
      max_tokens: 500,
      response_format: { type: "json_object" },
      messages: [
        {
          role: "system",
          content:
            clientReviewPrompt(childName) +
            '\nRespond ONLY with a JSON object: {"stars": 3|4|5, "wentWell": [two strings], "tryNext": string, "funComment": string}',
        },
        {
          role: "user",
          content: [
            { type: "image_url", image_url: { url: `data:${mediaType};base64,${base64}` } },
            { type: "text", text: `${childName} just made: "${recipeTitle}". Please review the photo.` },
          ],
        },
      ],
    }),
  });
  if (!res.ok) throw new Error(`OpenAI API error ${res.status}`);
  const data = await res.json();
  return JSON.parse(data.choices[0].message.content);
}

/* Main entry point used by app.js. `signal` lets the caller abort/timeout. */
async function getReview(photoDataUrl, recipeTitle, childName, signal) {
  if (!window.RK_STANDALONE) {
    const res = await fetch("/api/review", {
      method: "POST",
      signal,
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ image: photoDataUrl, recipeName: recipeTitle, childName }),
    });
    if (!res.ok) throw new Error("review request failed");
    return res.json();
  }

  const match = /^data:(image\/(?:jpeg|png|webp|gif));base64,(.+)$/.exec(photoDataUrl || "");
  const key = grownUpKey();
  if (!match || !key) return pickClientLocalReview();

  try {
    const raw =
      grownUpKeyKind(key) === "claude"
        ? await claudeBrowserReview(match[1], match[2], recipeTitle, childName, key, signal)
        : await openaiBrowserReview(match[1], match[2], recipeTitle, childName, key, signal);
    return { ...clientClampReview(raw), source: grownUpKeyKind(key) };
  } catch (err) {
    console.error("AI review failed, using built-in reviewer:", err);
    return pickClientLocalReview();
  }
}

  '\nRespond ONLY with a JSON object exactly like: {"title": string, "emoji": string, "category": string, "time": string, "serves": string, "ingredients": [string, ...], "steps": [{"text": string, "safety": boolean, "timer": integer minutes (0 = no timer)}, ...], "science": [string, string], "quiz": [{"q": string, "options": [4 strings], "answer": integer 0-3}, exactly 3 of them]}';

function clientDietRulesText(diet) {
  const rules = [];
  if (diet.includes("vegan")) rules.push("vegan (NO animal products at all - no meat, fish, dairy, eggs, honey or gelatine)");

  if (diet.includes("kosher")) rules.push("kosher (no pork or shellfish, and NEVER mix meat with dairy in the same recipe)");
  if (!rules.length) return "The child eats everything, so any child-friendly ingredients are fine.";
  return `STRICTLY respect what the child eats. Every ingredient must be: ${rules.join("; ")}.`;
}

function clientInventPrompt(childName, diet) {
  return `You are "Chef Sparkle", the warm, playful chef on a kids' cooking show, and a brilliant recipe writer.
A child around 9 years old named ${childName} will tell you a dish they dream of making. Invent one complete recipe they can really make at home. Rules you must always follow:
- Use British English spelling and simple words a 9-year-old understands. Be warm and playful, never babyish.
- Write between 5 and 10 steps. Each step is one clear thing to do.
- Set "safety" to true on ANY step that uses the oven, the hob, boiling water, a knife, a blender, the microwave or raw meat - and phrase that step "Ask a grown-up to..." so the child fetches help first.
- Set "timer" to the whole number of minutes ONLY when the step is a real wait (baking, chilling, freezing, resting) and make it match the minutes written in the step text. Use 0 when there is no waiting.
- ${clientDietRulesText(diet)}
- "science" must be EXACTLY 2 true, wow-worthy kitchen science facts about this dish - the kind that make a 9-year-old say "no way!".
- "quiz" must be EXACTLY 3 fun quiz questions about the dish or its science. Each has 4 options, and "answer" is the index (0, 1, 2 or 3) of the option that is genuinely correct.
- "emoji" is one single emoji that suits the dish. "category" must be exactly one of: "Bakes & Cakes", "Cold Drinks", "Quick Snacks", "Family Meals", "Breakfast".
- "time" is the friendly total time like "30 min". "serves" says how much it makes, like "2 glasses" or "8 biscuits".
- If the request is not food, or would not be safe for a child to help cook, never refuse harshly: cheerfully invent the closest fun, safe food idea instead (a "volcano" becomes an erupting volcano cake, a "potion" becomes a fizzy fruit potion drink).`;

// Kind stand-ins used only when the AI sends back too few facts or questions.
const CLIENT_FILLER_SCIENCE = [
  "Tasting is teamwork: your tongue and your nose work together, which is why food tastes dull when your nose is blocked!",
  "Cooking is really science you can eat - heat makes the tiny molecules in food jiggle faster and change into new tastes and textures.",
];
const CLIENT_FILLER_QUIZ = [
  { q: "What should every chef do before they start cooking?", options: ["Do a cartwheel", "Wash their hands", "Shout really loudly", "Hide all the spoons"], answer: 1 },
  { q: "Who should help when a step uses the oven or a sharp knife?", options: ["The family cat", "A teddy bear", "A grown-up", "Nobody at all"], answer: 2 },
  { q: "What makes a dish taste extra special?", options: ["Leaving it on the floor", "Making it with someone you love", "Forgetting about it", "Never tasting it"], answer: 1 },
];

/* Structured outputs can't enforce min/max, so every limit is clamped here too. */
function clientClampRecipe(raw) {
  const cleanStr = (v, fallback) => String(v == null ? "" : v).trim() || fallback;
  const emoji = String(raw.emoji == null ? "" : raw.emoji).trim();
  const ingredients = (Array.isArray(raw.ingredients) ? raw.ingredients : [])
    .map((i) => String(i == null ? "" : i).trim())
    .filter(Boolean)
    .slice(0, 30);
  if (!ingredients.length) ingredients.push("A sprinkle of imagination (ask a grown-up what's in the cupboard!)");
  const steps = (Array.isArray(raw.steps) ? raw.steps : [])
    .filter((s) => s && String(s.text == null ? "" : s.text).trim())
    .slice(0, 12)
    .map((s) => ({
      text: String(s.text).trim(),
      safety: s.safety === true,
      timer: Math.min(180, Math.max(0, Math.round(Number(s.timer)) || 0)),
    }));
  if (!steps.length) steps.push({ text: "Mix everything together, then taste and adjust like a proper chef!", safety: false, timer: 0 });
  const science = (Array.isArray(raw.science) ? raw.science : [])
    .map((f) => String(f == null ? "" : f).trim())
    .filter(Boolean)
    .slice(0, 2);
  while (science.length < 2) science.push(CLIENT_FILLER_SCIENCE[science.length]);
  const quiz = (Array.isArray(raw.quiz) ? raw.quiz : [])
    .filter((q) => q && String(q.q == null ? "" : q.q).trim() && Array.isArray(q.options) && q.options.length >= 4)
    .slice(0, 3)
    .map((q) => ({
      q: String(q.q).trim(),
      options: q.options.slice(0, 4).map((o) => String(o == null ? "" : o).trim() || "Hmm..."),
      answer: Math.min(3, Math.max(0, Math.round(Number(q.answer)) || 0)),
    }));
  while (quiz.length < 3) quiz.push(CLIENT_FILLER_QUIZ[quiz.length]);
  return {
    title: cleanStr(raw.title, "A Chef Sparkle surprise"),
    emoji: !emoji || emoji.length > 12 || /[<>&"']/.test(emoji) ? "🍽️" : emoji,
    category: CLIENT_RECIPE_CATEGORIES.includes(raw.category) ? raw.category : "Quick Snacks",
    time: cleanStr(raw.time, "30 min"),
    serves: cleanStr(raw.serves, "a chef-sized amount"),
    ingredients,
    steps,
    science,
    quiz,
  };
}

async function claudeBrowserInvent(query, childName, diet, key, signal) {
  const res = await fetch("https://api.anthropic.com/v1/messages", {
    method: "POST",
    signal,
    headers: {
      "content-type": "application/json",
      "x-api-key": key,
      "anthropic-version": "2023-06-01",
      "anthropic-dangerous-direct-browser-access": "true",
    },
    body: JSON.stringify({
      model: "claude-opus-4-8",
      max_tokens: 4096,
      system: clientInventPrompt(childName, diet),
      output_config: { format: { type: "json_schema", schema: CLIENT_RECIPE_SCHEMA } },
      messages: [
        { role: "user", content: `${childName} dreams of making: "${query}". Please invent the recipe!` },
      ],
    }),
  });
  if (!res.ok) throw new Error(`Claude API error ${res.status}`);
  const data = await res.json();
  const textBlock = (data.content || []).find((b) => b.type === "text");
  return JSON.parse(textBlock.text);
}

async function openaiBrowserInvent(query, childName, diet, key, signal) {
  const res = await fetch("https://api.openai.com/v1/chat/completions", {
    method: "POST",
    signal,
    headers: { "content-type": "application/json", Authorization: `Bearer ${key}` },
    body: JSON.stringify({
      model: "gpt-4o-mini",
      max_tokens: 4096,
      response_format: { type: "json_object" },
      messages: [
        { role: "system", content: clientInventPrompt(childName, diet) + CLIENT_RECIPE_SHAPE_NOTE },
        { role: "user", content: `${childName} dreams of making: "${query}". Please invent the recipe!` },
      ],
    }),
  });
  if (!res.ok) throw new Error(`OpenAI API error ${res.status}`);
  const data = await res.json();
  return JSON.parse(data.choices[0].message.content);
}

/* Main invent entry point used by app.js. Throws an Error with .code = "no-key"
   when no AI is available, so the UI can route to the Grown-ups' corner message. */
async function getInventedRecipe(query, childName, diet, signal) {
  if (!window.RK_STANDALONE) {
    const res = await fetch("/api/invent", {
      method: "POST",
      signal,
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ query, childName, diet }),
    });
    if (res.status === 503) {
      const err = new Error("no AI key is set up on the server");
      err.code = "no-key";
      throw err;
    }
    if (!res.ok) throw new Error("invent request failed");
    return clientClampRecipe(await res.json());
  }

  const key = grownUpKey();
  if (!key) {
    const err = new Error("no grown-up key saved on this device");
    err.code = "no-key";
    throw err;
  }
  const raw =
    grownUpKeyKind(key) === "claude"
      ? await claudeBrowserInvent(query, childName, diet, key, signal)
      : await openaiBrowserInvent(query, childName, diet, key, signal);
  return clientClampRecipe(raw);
}

/* Quick key test used by the Grown-ups' corner (tiny, near-free request) */
async function testGrownUpKey(key) {
  const kind = grownUpKeyKind(key);
  if (kind === "claude") {
    const res = await fetch("https://api.anthropic.com/v1/messages", {
      method: "POST",

        "anthropic-version": "2023-06-01",
        "anthropic-dangerous-direct-browser-access": "true",

        messages: [{ role: "user", content: "Reply with the single word: sizzle" }],
      }),

  }
  const res = await fetch("https://api.openai.com/v1/chat/completions", {
    method: "POST",
    headers: { "content-type": "application/json", Authorization: `Bearer ${key}` },
    body: JSON.stringify({

      max_tokens: 5,
      messages: [{ role: "user", content: "Reply with the single word: sizzle" }],
    }),
  });
  return res.ok;
}

  function renderIngredientList() {
    const list = document.getElementById("rb-ing-list");
    list.innerHTML = draft.ingredients.length
      ? draft.ingredients.map((ing, i) => `<li>${esc(ing)} <button class="remove-btn" data-i="${i}" aria-label="Remove ingredient">✖</button></li>`).join("")
      : `<li class="builder-empty">Nothing yet - add your first ingredient below!</li>`;
    list.querySelectorAll(".remove-btn").forEach((b) =>
      b.addEventListener("click", () => {
        draft.ingredients.splice(Number(b.dataset.i), 1);
        renderIngredientList();
      })
    );
  }

  function renderStepList() {
    const list = document.getElementById("rb-step-list");
    list.innerHTML = draft.steps.length
      ? draft.steps.map((s, i) => `<li>${esc(s.text)}${s.safety ? " 🦺" : ""}${s.timer ? ` ⏰ ${s.timer} min` : ""} <button class="remove-btn" data-i="${i}" aria-label="Remove step">✖</button></li>`).join("")
      : `<li class="builder-empty">No steps yet - what do you do first?</li>`;
    list.querySelectorAll(".remove-btn").forEach((b) =>
      b.addEventListener("click", () => {
        draft.steps.splice(Number(b.dataset.i), 1);
        renderStepList();
      })
    );
  }

  document.getElementById("back-btn").addEventListener("click", renderHome);

  document.querySelectorAll("#rb-emoji .emoji-btn").forEach((btn) =>
    btn.addEventListener("click", () => {
      document.querySelectorAll("#rb-emoji .emoji-btn").forEach((b) => b.classList.remove("selected"));

  document.getElementById("rb-add-ing").addEventListener("click", () => {

    const text = input.value.trim();
    if (!text) {
      toast("Type an ingredient first, chef! ✍️");
      return;
    }
    draft.ingredients.push(text);
    input.value = "";
    input.focus();
    renderIngredientList();
  });

  document.getElementById("rb-add-step").addEventListener("click", () => {
    const input = document.getElementById("rb-step-input");
    const text = input.value.trim();
    if (!text) {
      toast("Type what to do in this step first! ✍️");
      return;
    }
    const step = { text };
    const safetyBox = document.getElementById("rb-step-safety");
    if (safetyBox.checked) step.safety = true;
    const timerInput = document.getElementById("rb-step-timer");
    const mins = parseInt(timerInput.value, 10);
    if (mins > 0) step.timer = Math.min(mins, 180);
    draft.steps.push(step);
    input.value = "";
    safetyBox.checked = false;
    timerInput.value = "";
    renderStepList();
  });

  document.getElementById("rb-save").addEventListener("click", () => {
    const title = document.getElementById("rb-name").value.trim();
    if (!title) {
      toast("Give your recipe a name first, chef! ✍️");
      return;

    if (!draft.ingredients.length) {
      toast("Add at least one ingredient - what goes in it? 🛒");
      return;

    if (!draft.steps.length) {
      toast("Add at least one step - how do you make it? 👣");
      return;

    const recipe = {
      id: "my-" + Date.now(),
      title,
      emoji: document.querySelector("#rb-emoji .emoji-btn.selected").dataset.emoji,
      category: document.querySelector("#rb-cat .chip.selected").dataset.cat,
      time: "?",
      difficulty: "My recipe",
      serves: document.getElementById("rb-serves").value.trim() || "a chef-sized amount",
      diet: { veggie: true, vegan: true, halal: true, kosher: true },
      custom: true,
      ingredients: draft.ingredients.slice(),
      steps: draft.steps.slice(),
      science: [],
      quiz: [],
    };
    state.myRecipes.push(recipe);
    saveState();
    awardXP(30, "for inventing a recipe! 🧪");
    renderRecipe(recipe.id);
  });

  renderIngredientList();
  renderStepList();
}

/* ---------- Chef Sparkle invents a recipe ---------- */
function renderInvent(prefillQuery) {
  setNav("home");
  show(`
    <button class="btn btn-ghost" id="back-btn">⬅ Back to recipes</button>
    <div class="card builder">
      <h1>Invent with Chef Sparkle! 🪄</h1>

      <button class="btn btn-primary btn-big" id="invent-go">Invent it! 🪄</button>
    </div>
  `);
  document.getElementById("back-btn").addEventListener("click", renderHome);
  const input = document.getElementById("invent-input");
  const goBtn = document.getElementById("invent-go");
  goBtn.addEventListener("click", () => submitInvent(input.value, goBtn));
  input.addEventListener("keydown", (e) => {

  });

async function submitInvent(rawQuery, goBtn) {
  const query = rawQuery.trim();
  if (query.length < 2) {
    toast("Tell Chef Sparkle what to invent first! ✍️");
    return;
  }
  if (goBtn) goBtn.disabled = true; // no double-taps while the magic happens

  show(`
    <div class="card finish">
      <span class="spinner">🪄</span>
      <h2>Chef Sparkle is scribbling in the magic recipe book...</h2>
      <p class="sub">Inventing something delicious just for you, ${esc(state.name)}!</p>
      <button class="btn btn-ghost" id="invent-escape">Taking too long? Go back ⬅</button>
    </div>
  `);

  // Never leave her on the spinner: a 60s timeout drops into the kind
  // try-again card, and "Go back" really goes back (no scary error card).
  const controller = new AbortController();
  let escaped = false;
  const timeout = setTimeout(() => controller.abort(), 60000);
  document.getElementById("invent-escape").addEventListener("click", () => {
    escaped = true;
    controller.abort();
  });

  try {
    const invented = await getInventedRecipe(query, state.name, state.diet.filter((d) => d !== "everything"), controller.signal);
    clearTimeout(timeout);
    const recipe = {
      id: "ai-" + Date.now(),
      title: invented.title,
      emoji: invented.emoji,
      category: invented.category,
      time: invented.time,
      difficulty: "Chef Sparkle",
      serves: invented.serves,
      diet: { veggie: true, vegan: true, halal: true, kosher: true },
      custom: true,
      invented: true,
      ingredients: invented.ingredients,
      steps: invented.steps.map((s) => {
        const step = { text: s.text };
        if (s.safety) step.safety = true;
        if (s.timer) step.timer = s.timer;
        return step;
      }),
      science: invented.science,
      quiz: invented.quiz,
    };
    state.myRecipes.push(recipe);
    saveState();
    awardXP(20, "for dreaming up a recipe with Chef Sparkle! 🪄");
    renderRecipe(recipe.id);
  } catch (err) {
    clearTimeout(timeout);
    if (escaped) renderInvent(query); // she chose to go back - no error card
    else if (err && err.code === "no-key") renderInventNoKey();
    else renderInventError(query);
  }
}

/* ---------- Cooking mode ---------- */
function startCooking(recipe) {
  cooking = {
    recipe,
    step: 0,
    quizPool: recipe.quiz.map((_, i) => i),
    sciencePool: recipe.science.map((_, i) => i),
    factPool: recipe.custom ? GENERIC_FACTS.map((_, i) => i) : [],
    timerEndAt: null, // wall-clock deadline of a running step timer, survives navigation
  };
  renderStep();
}

/* Jump back into an in-progress cooking session (from the resume banner). */
function resumeCooking() {
  if (!cooking) return renderHome();
  const s = cooking.recipe.steps[cooking.step];
  if (s && s.timer && cooking.timerEndAt) renderTimer(s.timer);
  else renderStep();
}

function resumeBannerHtml() {
  if (!cooking) return "";
  return `<button class="resume-banner" id="resume-cooking">🍳 You're still making ${esc(cooking.recipe.title)} - back to step ${cooking.step + 1} ➡️</button>`;
}
function wireResumeBanner() {
  const b = document.getElementById("resume-cooking");
  if (b) b.addEventListener("click", resumeCooking);
}

function renderStep() {
  const { recipe, step } = cooking;
  const s = recipe.steps[step];
  setNav("home");

  const dots = recipe.steps
    .map((_, i) => `<div class="dot ${i < step ? "done" : i === step ? "now" : ""}"></div>`)
    .join("");

  show(`
    <div class="cook-progress">${dots}</div>
    <div class="card step-card">
      <div class="step-num">${esc(recipe.title)} · Step ${step + 1} of ${recipe.steps.length}</div>
      ${s.safety ? `<div class="safety-banner">🦺 GRAB A GROWN-UP for this step!</div>` : ""}
      <div class="step-text">${esc(s.text)}</div>
      ${
        s.timer
          ? `<button class="btn btn-primary btn-big" id="start-timer">Start the ${s.timer} minute timer ⏰</button>`
          : `<button class="btn btn-primary btn-big" id="next-step">${s.safety ? "My grown-up is here! Next ➡️" : step === recipe.steps.length - 1 ? "All done! 🎉" : "Done - next step ➡️"}</button>`
      }
      <br/><br/>
      <button class="btn btn-ghost" id="quit-cooking">✖ Stop cooking (progress isn't lost - XP is forever!)</button>
    </div>
  `);

  document.getElementById("quit-cooking").addEventListener("click", () => {
    cooking = null;
    renderHome();
  });

  if (s.timer) {
    document.getElementById("start-timer").addEventListener("click", () => renderTimer(s.timer));
  } else {
    document.getElementById("next-step").addEventListener("click", () => {
      if (s.safety) {
        state.safetyChecks += 1;
        awardXP(5, "for kitchen safety 🦺");
      } else {
        awardXP(5, "for finishing a step");
      }
      advanceStep();
    });
  }
}

function advanceStep() {
  cooking.timerEndAt = null;
  cooking.step += 1;
  if (cooking.step >= cooking.recipe.steps.length) {
    renderFinish();
  } else {
    renderStep();
  }
}

/* ---------- Timer + challenges ---------- */
let timerInterval = null;
let timerTick = null;
function stopTimer() {
  if (timerInterval) {
    clearInterval(timerInterval);
    timerInterval = null;
  }
  timerTick = null;
}
// Tablets throttle background timers - when the screen wakes, snap the
// countdown straight to the correct wall-clock time.
document.addEventListener("visibilitychange", () => {
  if (!document.hidden && timerTick) timerTick();
});

function renderTimer(minutes) {
  // Anchor to wall-clock time so screen-lock or app-switching can't slow the
  // countdown - the oven doesn't pause, so neither do we.
  if (!cooking.timerEndAt) cooking.timerEndAt = Date.now() + minutes * 60000;

  show(`
    <div class="card step-card">
      <div class="timer-sub">${esc(cooking.recipe.title)} is doing its thing... ⏳</div>
      <div class="timer-display" id="timer-display"></div>
      <div class="timer-sub">Challenge time - earn XP while you wait!</div>
    </div>
    <div id="challenge-zone"></div>
    <div class="card step-card">
      <button class="btn btn-secondary" id="timer-done" disabled>Timer still going...</button>
      <br/><br/>
      <button class="btn btn-ghost" id="skip-timer">⏭ Our timer already beeped - skip ahead</button>
    </div>
  `);

  const display = document.getElementById("timer-display");
  const doneBtn = document.getElementById("timer-done");
  let dinged = false;

  function tick() {
    const remaining = Math.max(0, Math.ceil((cooking.timerEndAt - Date.now()) / 1000));
    const m = Math.floor(remaining / 60);
    const s = remaining % 60;
    display.textContent = `${String(m).padStart(2, "0")}:${String(s).padStart(2, "0")}`;
    if (remaining <= 0 && !dinged) {
      dinged = true;
      stopTimer();
      doneBtn.textContent = "DING! ⏰ Next step ➡️";
      doneBtn.disabled = false;
      doneBtn.classList.remove("btn-secondary");
      doneBtn.classList.add("btn-primary");
      toast("⏰ DING! Time's up!");
    }
  }
  tick();
  timerInterval = setInterval(tick, 1000);
  timerTick = tick;

  doneBtn.addEventListener("click", () => { stopTimer(); advanceStep(); });
  document.getElementById("skip-timer").addEventListener("click", () => { stopTimer(); advanceStep(); });

  renderChallenge();
}

function renderChallenge() {
  const zone = document.getElementById("challenge-zone");
  if (!zone) return;
  const { recipe } = cooking;

  if (cooking.quizPool.length > 0) {
    const qi = cooking.quizPool.shift();
    const q = recipe.quiz[qi];
    zone.innerHTML = `
      <div class="card challenge-card">
        <div class="step-num">🧠 Quiz challenge</div>
        <div class="challenge-q">${esc(q.q)}</div>
        <div class="answer-grid">
          ${q.options.map((o, i) => `<button class="answer-btn" data-i="${i}">${esc(o)}</button>`).join("")}
        </div>
      </div>`;
    zone.querySelectorAll(".answer-btn").forEach((btn) =>
      btn.addEventListener("click", () => {
        const picked = Number(btn.dataset.i);
        zone.querySelectorAll(".answer-btn").forEach((b) => (b.disabled = true));
        const correctBtn = zone.querySelector(`[data-i="${q.answer}"]`);
        correctBtn.classList.add("correct");
        if (picked === q.answer) {
          state.quizCorrect += 1;
          awardXP(20, "for a correct answer! 🧠");
        } else {
          btn.classList.add("wrong");
          toast("Nearly! Now you know for next time 💪");
        }
        setTimeout(renderChallenge, 1800);
      })
    );
  } else if (cooking.sciencePool.length > 0) {
    const si = cooking.sciencePool.shift();
    zone.innerHTML = `
      <div class="card science-card">
        <h3>🔬 Kitchen science fact</h3>
        <p>${esc(recipe.science[si])}</p>
        <br/>
        <button class="btn btn-secondary" id="next-fact">Another one! ➡️</button>
      </div>`;
    document.getElementById("next-fact").addEventListener("click", renderChallenge);
  } else if (cooking.factPool.length > 0) {
    const fi = cooking.factPool.shift();
    zone.innerHTML = `
      <div class="card science-card">
        <h3>🔬 Kitchen science fact</h3>
        <p>${esc(GENERIC_FACTS[fi])}</p>
        <br/>
        <button class="btn btn-secondary" id="next-fact">Another one! ➡️</button>
      </div>`;
    document.getElementById("next-fact").addEventListener("click", renderChallenge);
  } else {
    zone.innerHTML = `
      <div class="card step-card">
        <span class="big-emoji" style="font-size:2.6rem">🧘</span>
        <p class="sub">Challenges complete, chef! Tidy your station like the pros do - a clean kitchen is a happy kitchen.</p>
      </div>`;
  }
}

/* ---------- Finish: photo + AI review ---------- */
function renderFinish() {
  const recipe = cooking.recipe;
  cooking = null; // the cooking part is done - no resume banner for a finished dish
  const isNewCompletion = !state.completed.includes(recipe.id);
  if (isNewCompletion) state.completed.push(recipe.id);
  const sticker = STICKERS[Math.floor(Math.random() * STICKERS.length)];
  state.stickers.push(sticker);
  // The cookbook entry is created NOW, so the dish is saved whatever she does
  // next - the photo and review are added to it if they arrive.
  const entry = addCookbookEntry(recipe, null, null);
  saveState();
  awardXP(50, `for finishing ${recipe.title}!`);

  show(`
    <div class="card finish">
      <div class="confetti">🎉✨🎊</div>
      <h1>You made ${esc(recipe.title)}! ${esc(recipe.emoji)}</h1>
      <p class="sub">You earned a surprise sticker...</p>
      <div class="sticker-reveal">${sticker}</div>
      <p class="sub">It's saved in your cookbook! Now take a photo so Chef Sparkle can review it.</p>
      <label class="btn btn-primary btn-big" for="photo-input">📸 Take a photo of your dish</label>
      <input type="file" id="photo-input" accept="image/*" capture="environment" />
      <br/><br/>
      <button class="btn btn-ghost" id="skip-photo">Skip the photo this time</button>
      <div id="photo-zone"></div>
    </div>
  `);

  document.getElementById("skip-photo").addEventListener("click", () => {
    renderCookbook();
    toast("Saved to your cookbook (no photo this time) 📖");
  });

  document.getElementById("photo-input").addEventListener("change", async (e) => {
    const file = e.target.files[0];
    if (!file) return;
    try {
      const dataUrl = await downscaleImage(file, 700);
      const zone = document.getElementById("photo-zone");
      zone.innerHTML = `
        <img src="${dataUrl}" class="photo-preview" alt="Your dish" />
        <button class="btn btn-primary btn-big" id="send-review">Send to Chef Sparkle for review ✨</button>
      `;
      document.getElementById("send-review").addEventListener("click", () => requestReview(recipe, dataUrl, entry));
    } catch (err) {
      const zone = document.getElementById("photo-zone");
      if (zone) zone.innerHTML = `<p class="sub" style="margin-top:14px">📷 Hmm, that photo was camera-shy! Try snapping a fresh one with the camera.</p>`;
    } finally {
      e.target.value = ""; // so picking the same file again re-fires this handler
    }
  });
}

function downscaleImage(file, maxSize) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    const url = URL.createObjectURL(file);
    img.onload = () => {
      const scale = Math.min(1, maxSize / Math.max(img.width, img.height));
      const canvas = document.createElement("canvas");
      canvas.width = Math.round(img.width * scale);
      canvas.height = Math.round(img.height * scale);
      canvas.getContext("2d").drawImage(img, 0, 0, canvas.width, canvas.height);
      URL.revokeObjectURL(url);
      resolve(canvas.toDataURL("image/jpeg", 0.72));
    };
    img.onerror = () => {
      URL.revokeObjectURL(url);
      reject(new Error("Could not read that image file"));
    };
    img.src = url;
  });
}

async function requestReview(recipe, photoDataUrl, entry) {
  show(`
    <div class="card finish">
      <span class="spinner">🍳</span>
      <h2>Chef Sparkle is looking at your ${esc(recipe.title)}...</h2>
      <p class="sub">Judges take their time with masterpieces!</p>
      <button class="btn btn-ghost" id="review-escape">Taking too long? Save it anyway ➡️</button>
    </div>
  `);

  // Never leave her on the spinner: a 25s timeout and an escape button both
  // abort the request and drop into the kind built-in review below.
  const controller = new AbortController();
  const timeout = setTimeout(() => controller.abort(), 25000);
  document.getElementById("review-escape").addEventListener("click", () => controller.abort());

  let review;
  try {
    review = await getReview(photoDataUrl, recipe.title, state.name, controller.signal);
  } catch (err) {
    review = {
      stars: 4,
      wentWell: ["You finished every single step like a real chef", "Your dish made it all the way to the photo - that's dedication"],
      tryNext: "Next time, try arranging it on your fanciest plate!",
      funComment: "Chef Sparkle's tummy is rumbling just looking at it!",
    };
  }
  clearTimeout(timeout);

  // Stars only ever go up
  const prev = state.recipeStars[recipe.id] || 0;
  const finalStars = Math.max(prev, review.stars);
  state.recipeStars[recipe.id] = finalStars;

  // Update the entry that renderFinish already created - never a duplicate.
  entry.photo = photoDataUrl;
  entry.review = { stars: finalStars, wentWell: review.wentWell, tryNext: review.tryNext, funComment: review.funComment };
  saveState();
  checkBadges();
  awardXP(15, "for photographing your dish 📸");
  awardXP(review.stars * 10, `for ${review.stars} stars from Chef Sparkle!`);

  show(`
    <div class="card finish">
      <h1>Chef Sparkle's review 👩‍🍳✨</h1>
      <img src="${photoDataUrl}" class="photo-preview" alt="Your dish" />
      <div class="stars-big">${"⭐".repeat(finalStars)}</div>
      ${finalStars > prev && prev > 0 ? `<p class="sub">Up from ${prev} stars last time - you're improving! 📈</p>` : ""}
      <div class="review-list">
        ${review.wentWell.map((w) => `<div class="item good">💚 ${esc(w)}</div>`).join("")}
        <div class="item tip">💡 ${esc(review.tryNext)}</div>
      </div>
      <p class="fun-comment">"${esc(review.funComment)}"</p>
      <br/>
      <button class="btn btn-primary btn-big" id="to-cookbook">See it in my cookbook 📖</button>
    </div>
  `);
  document.getElementById("to-cookbook").addEventListener("click", renderCookbook);
}

function addCookbookEntry(recipe, photo, review) {
  const entry = {
    recipeId: recipe.id,
    title: recipe.title,
    emoji: recipe.emoji,
    date: new Date().toLocaleDateString("en-GB", { day: "numeric", month: "short", year: "numeric" }),
    photo,
    review,
  };
  state.cookbook.unshift(entry);
  saveState();
  checkBadges();
  return entry;
}

/* ---------- Cookbook ---------- */
function renderCookbook() {
  setNav("cookbook");
  if (!state.cookbook.length) {
    show(`
      <h1>📖 ${esc(state.name)}'s Cookbook</h1>
      <div class="card empty-state">
        <span class="big-emoji">🍽️</span>
        Your cookbook is hungry for its first dish!<br/>Finish a recipe and it'll appear here with your photo.
        <br/><br/>
        <button class="btn btn-primary" id="go-cook">Find a recipe 🔍</button>
      </div>
    `);
    document.getElementById("go-cook").addEventListener("click", renderHome);
    return;
  }

  show(`
    ${resumeBannerHtml()}
    <h1>📖 ${esc(state.name)}'s Cookbook</h1>
    <p class="sub">${state.cookbook.length} dish${state.cookbook.length === 1 ? "" : "es"} and counting! Tap one to read Chef Sparkle's review again.</p>
    <div class="cookbook-grid">
      ${state.cookbook
        .map(
          (en, i) => `
        <button class="card book-entry" data-i="${i}">
          ${en.photo ? `<img src="${en.photo}" alt="${esc(en.title)}" />` : `<div style="height:160px;display:flex;align-items:center;justify-content:center;font-size:3.4rem;background:#fff1e0">${esc(en.emoji)}</div>`}
          <div class="body">
            <h3>${esc(en.emoji)} ${esc(en.title)}</h3>
            <div class="date">${esc(en.date)}</div>
            ${en.review ? `<div class="stars-mini">${"⭐".repeat(en.review.stars)}</div>` : ""}
          </div>
        </button>`
        )
        .join("")}
    </div>
  `);
  wireResumeBanner();
  document.querySelectorAll(".book-entry").forEach((tile) =>
    tile.addEventListener("click", () => renderBookEntry(Number(tile.dataset.i)))
  );
}

/* A single cookbook memory: big photo, the full review, and a "make it again" link. */
function renderBookEntry(i) {
  const en = state.cookbook[i];
  if (!en) return renderCookbook();
  setNav("cookbook");
  const recipeStillExists = allRecipes().some((r) => r.id === en.recipeId);

  show(`
    <button class="btn btn-ghost" id="back-btn">⬅ Back to my cookbook</button>
    <div class="card finish">
      <h1>${esc(en.emoji)} ${esc(en.title)}</h1>
      <p class="sub">Made on ${esc(en.date)}</p>
      ${en.photo ? `<img src="${en.photo}" class="photo-preview" alt="${esc(en.title)}" />` : `<div style="font-size:5rem;margin:16px 0">${esc(en.emoji)}</div>`}
      ${
        en.review
          ? `
      <div class="stars-big">${"⭐".repeat(en.review.stars)}</div>
      <div class="review-list">
        ${(en.review.wentWell || []).map((w) => `<div class="item good">💚 ${esc(w)}</div>`).join("")}
        ${en.review.tryNext ? `<div class="item tip">💡 ${esc(en.review.tryNext)}</div>` : ""}
      </div>
      ${en.review.funComment ? `<p class="fun-comment">"${esc(en.review.funComment)}"</p>` : ""}`
          : `<p class="sub">No photo review for this one - next time, snap it for Chef Sparkle!</p>`
      }
      <br/>
      ${recipeStillExists ? `<button class="btn btn-primary btn-big" id="make-again">Make it again! 🍳</button>` : ""}
    </div>
  `);
  document.getElementById("back-btn").addEventListener("click", renderCookbook);
  const again = document.getElementById("make-again");
  if (again) again.addEventListener("click", () => renderRecipe(en.recipeId));
}

/* ---------- Badges ---------- */
function renderBadges() {
  setNav("badges");
  const rank = rankFor(state.xp);
  const next = nextRank(state.xp);
  const pct = next ? Math.min(100, Math.round(((state.xp - rank.xp) / (next.xp - rank.xp)) * 100)) : 100;

  show(`
    ${resumeBannerHtml()}
    <h1>🏅 ${esc(state.name)}'s Trophy Shelf</h1>
    <div class="card hero">
      <div class="avatar">${rank.emoji}</div>
      <div style="flex:1">
        <div class="rank-name">${esc(rankDisplayName(rank))}</div>
        <div class="xp-bar"><div class="xp-fill" style="width:${pct}%"></div></div>
        <div class="xp-label">${state.xp} XP${next ? ` · ${next.xp - state.xp} XP to ${esc(next.name)} ${next.emoji}` : " · Top rank! 🎉"}</div>
      </div>
    </div>
    <div style="text-align:center; margin-bottom:14px"><button class="btn btn-ghost" id="edit-profile">⚙️ Change my chef name or what I eat</button></div>
    <h2>Badges (${state.badges.length}/${BADGES.length})</h2>
    <div class="badge-grid">
      ${BADGES.map(
        (b) => `
        <div class="card badge-tile ${state.badges.includes(b.id) ? "earned" : ""}">
          <span class="big-emoji">${b.emoji}</span>
          <h4>${esc(b.name)}</h4>
          <p>${esc(b.desc)}</p>
        </div>`
      ).join("")}
    </div>
    <br/>
    <h2>Sticker collection (${state.stickers.length})</h2>
    <div class="card" style="font-size:2rem; letter-spacing:6px; text-align:center">
      ${state.stickers.length ? state.stickers.join(" ") : '<span class="sub" style="font-size:1rem">Finish a recipe to win your first surprise sticker!</span>'}
    </div>
    ${window.RK_STANDALONE ? `
    <br/>
    <div class="card" style="text-align:center; border: 3px dashed var(--sun)">
      <h2>🔑 Grown-ups' corner</h2>
      <p class="sub">${grownUpKey() ? "AI reviews are switched on for this device ✅" : "Grown-ups: add an AI key here so Chef Sparkle can really review the dish photos (optional - a friendly built-in reviewer works without one)."}</p>
      <button class="btn btn-secondary" id="grown-ups">Open the Grown-ups' corner</button>
    </div>` : ""}
  `);
  wireResumeBanner();
  document.getElementById("edit-profile").addEventListener("click", renderOnboarding);
  const grownUps = document.getElementById("grown-ups");
  if (grownUps) grownUps.addEventListener("click", renderGrownUps);
}

/* ---------- Grown-ups' corner (standalone/tablet edition only) ---------- */
function renderGrownUps() {
  setNav("badges");
  const existing = grownUpKey();

  show(`
    <button class="btn btn-ghost" id="back-btn">⬅ Back to badges</button>
    <div class="card">
      <h1>🔑 Grown-ups' corner</h1>
      <p class="sub">Paste an API key here to switch on real AI photo reviews from Chef Sparkle.
      Use a key created just for this app with a low monthly spending cap - each review costs a few pence.
      Without a key, a friendly built-in reviewer takes over, so the app always works.</p>
      <p class="sub"><strong>${existing ? `A ${grownUpKeyKind(existing) === "claude" ? "Claude" : "OpenAI"} key is saved on this device ✅` : "No key saved on this device yet."}</strong></p>
      <input type="password" id="key-input" class="key-input" placeholder="Paste the key (sk-ant-... or sk-...)" autocomplete="off" />
      <div class="chip-row" style="justify-content:center">
        <button class="btn btn-primary" id="key-save">Save key</button>
        <button class="btn btn-secondary" id="key-test">Test it</button>
        ${existing ? `<button class="btn btn-ghost" id="key-remove">Remove saved key</button>` : ""}
      </div>
    </div>
  `);

  document.getElementById("back-btn").addEventListener("click", renderBadges);
  document.getElementById("key-save").addEventListener("click", () => {
    const key = document.getElementById("key-input").value.trim();
    if (!key) return toast("Paste a key first ✍️");
    if (saveGrownUpKey(key)) {
      toast(`✅ ${grownUpKeyKind(key) === "claude" ? "Claude" : "OpenAI"} key saved on this device`);
      renderGrownUps();
    } else {
      toast("❌ Couldn't save the key - storage may be blocked in this browser");
    }
  });
  document.getElementById("key-test").addEventListener("click", async () => {
    const key = document.getElementById("key-input").value.trim() || grownUpKey();
    if (!key) return toast("Paste or save a key first ✍️");
    toast("Testing the key... ⏳");
    try {
      toast((await testGrownUpKey(key)) ? "✅ The key works! Chef Sparkle is ready" : "❌ That key was rejected - check it and try again");
    } catch (err) {
      toast("❌ Couldn't reach the AI - check the internet connection");
    }
  });
  const removeBtn = document.getElementById("key-remove");
  if (removeBtn) {
    removeBtn.addEventListener("click", () => {
      removeGrownUpKey();
      toast("Key removed - back to the built-in reviewer");
      renderGrownUps();
    });
  }
}

/* ---------- Boot ---------- */
// Nav never destroys a cooking session - the resume banner brings her back.
document.querySelectorAll(".nav-btn").forEach((b) =>
  b.addEventListener("click", () => {
    if (b.dataset.nav === "home") renderHome();
    if (b.dataset.nav === "cookbook") renderCookbook();
    if (b.dataset.nav === "badges") renderBadges();
  })
);

if (state.onboarded) {
  renderHome();
} else {
  renderOnboarding();
}
</script>
